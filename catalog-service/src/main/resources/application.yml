spring:
  application:
    name: catalog-service
  main:
    banner-mode: "off"
  jackson:
    time-zone: UTC
    property-naming-strategy: LOWER_CAMEL_CASE
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:fresveg_catalog}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
  liquibase:
    change-log: classpath:database/catalog/db.changelog-catalog-master.yaml
    contexts: service
    default-schema: catalog
    liquibase-schema: catalog
    url: ${spring.datasource.url}
    user: ${MIGRATION_DB_USER:fresveg_catalog_migrator}
    password: ${MIGRATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: catalog
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

catalog:
  account-base-url: ${ACCOUNT_BASE_URL}
  security:
    issuer-uri: ${OIDC_ISSUER_URI}
    audience: ${OIDC_AUDIENCE}
    jwk-set-uri: ${OIDC_JWK_SET_URI}
springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    version: OPENAPI_3_1
  paths-to-match: /api/v1/catalog/**
