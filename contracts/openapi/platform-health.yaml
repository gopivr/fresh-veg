openapi: 3.1.0
info:
  title: FresVeg operational health
  version: 0.1.0
  description: >-
    Shared Actuator contract for the gateway and five domain services. Domain-service readiness includes PostgreSQL connectivity as of Phase 2.
    These operational endpoints use native Actuator responses. Business API
    envelopes and routes will be added with their owning phases.
servers:
  - url: http://localhost:8080
    description: API gateway
  - url: http://localhost:8081
    description: Account service
  - url: http://localhost:8082
    description: Catalog service
  - url: http://localhost:8083
    description: Supply service
  - url: http://localhost:8084
    description: Commerce service
  - url: http://localhost:8085
    description: Fulfillment service
security: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Check application health
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Check application liveness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Check application readiness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: A safe ID is echoed; missing or unsafe values are replaced with a UUID.
      schema:
        type: string
  headers:
    CorrelationId:
      description: Request correlation identifier, preserved if safe or generated by the application.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Optional available probe groups on the root health endpoint.
          items:
            type: string
  responses:
    Healthy:
      description: Application is healthy for this probe.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Unhealthy:
      description: Application is down or out of service for this probe.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
