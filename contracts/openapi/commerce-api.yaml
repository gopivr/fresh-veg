      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: "[A-Z]{3}"
      required:
      - currency
    ApiResponseCartResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CartResponse"
