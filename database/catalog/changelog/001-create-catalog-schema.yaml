databaseChangeLog:
  - changeSet:
      id: catalog-001-create-schema
      author: fresveg
      logicalFilePath: database/catalog/changelog/001-create-catalog-schema.yaml
      dbms: postgresql
      comment: Provision isolated schema, migration owner and runtime login without embedded credentials. No automated rollback after service initialization.
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM pg_roles WHERE rolname IN ('fresveg_catalog', 'fresveg_catalog_migrator')
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM pg_namespace WHERE nspname = 'catalog'
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE ROLE fresveg_catalog_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
              CREATE ROLE fresveg_catalog LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
              CREATE SCHEMA catalog AUTHORIZATION fresveg_catalog_migrator;
              REVOKE ALL ON SCHEMA catalog FROM PUBLIC;
              GRANT USAGE ON SCHEMA catalog TO fresveg_catalog;
              ALTER ROLE fresveg_catalog_migrator SET search_path = catalog;
              ALTER ROLE fresveg_catalog SET search_path = catalog;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_catalog_migrator IN SCHEMA catalog REVOKE ALL ON TABLES FROM PUBLIC;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_catalog_migrator IN SCHEMA catalog REVOKE ALL ON SEQUENCES FROM PUBLIC;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_catalog_migrator IN SCHEMA catalog REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;
              DO $bootstrap$
              BEGIN
                EXECUTE format('GRANT CONNECT ON DATABASE %I TO fresveg_catalog, fresveg_catalog_migrator', current_database());
              END
              $bootstrap$;
