components:
  schemas:
    UpdateLocationRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          pattern: "[A-Z0-9][A-Z0-9_-]{0,63}"
        name:
          type: string
          maxLength: 160
          minLength: 0
        line1:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 100
          minLength: 0
        postalCode:
          type: string
          maxLength: 20
          minLength: 0
        countryCode:
          type: string
          minLength: 1
          pattern: "[A-Z]{2}"
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        version:
          type: integer
          format: int64
      required:
      - city
      - code
      - countryCode
      - line1
      - name
      - postalCode
      - status
      - version
    ApiResponseLocationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/LocationResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    LocationResponse:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        line1:
          type: string
        city:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        version:
          type: integer
          format: int64
      required:
      - city
      - code
      - countryCode
      - line1
      - locationId
      - name
      - postalCode
      - status
      - vendorId
      - version
    Meta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - requestId
      - timestamp
    PriceRequest:
      type: object
      additionalProperties: false
      properties:
        priceId:
          type:
          - string
          - "null"
          format: uuid
        currency:
          type: string
          minLength: 1
          pattern: "[A-Z]{3}"
        unitPrice:
          type: number
          minimum: 0
        minQuantity:
          type: number
          minimum: 0
        validFrom:
          type: string
          format: date-time
        validTo:
          type:
          - string
          - "null"
          format: date-time
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/TierRequest"
          maxItems: 50
          minItems: 0
      required:
      - currency
      - minQuantity
      - tiers
      - unitPrice
      - validFrom
    TierRequest:
      type: object
      additionalProperties: false
      properties:
        minQuantity:
          type: number
          minimum: 0
        unitPrice:
          type: number
          minimum: 0
      required:
      - minQuantity
      - unitPrice
    UpdateListingRequest:
      type: object
      additionalProperties: false
      properties:
        locationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        vendorSku:
          type: string
          minLength: 1
          pattern: "[A-Z0-9][A-Z0-9_-]{0,63}"
        uomCode:
          type: string
          maxLength: 16
          minLength: 0
        minimumOrderQuantity:
          type: number
          minimum: 0
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        attributes:
          type: object
          additionalProperties: {}
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PriceRequest"
          maxItems: 50
          minItems: 0
        version:
          type: integer
          format: int64
      required:
      - attributes
      - locationId
      - minimumOrderQuantity
      - prices
      - productId
      - status
      - uomCode
      - variantId
      - vendorSku
      - version
    ApiResponseListingResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ListingResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    ListingResponse:
      type: object
      properties:
        listingId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        vendorSku:
          type: string
        uomCode:
          type: string
        minimumOrderQuantity:
          type: number
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - ARCHIVED
        attributes:
          type: object
          additionalProperties: {}
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PriceResponse"
        version:
          type: integer
          format: int64
      required:
      - attributes
      - listingId
      - locationId
      - minimumOrderQuantity
      - prices
      - productId
      - status
      - uomCode
      - variantId
      - vendorId
      - vendorSku
      - version
    PriceResponse:
      type: object
      properties:
        priceId:
          type: string
          format: uuid
        currency:
          type: string
        unitPrice:
          type: number
        minQuantity:
          type: number
        validFrom:
          type: string
          format: date-time
        validTo:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/TierResponse"
      required:
      - currency
      - minQuantity
      - priceId
      - status
      - tiers
      - unitPrice
      - validFrom
      - validTo
    TierResponse:
      type: object
      properties:
        tierId:
          type:
          - string
          - "null"
          format: uuid
        minQuantity:
          type: number
        unitPrice:
          type: number
      required:
      - minQuantity
      - tierId
      - unitPrice
    AdjustInventoryRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
        batchId:
          type: string
          format: uuid
        quantityDelta:
          type: number
        reason:
          type: string
          maxLength: 240
          minLength: 0
      required:
      - batchId
      - quantityDelta
      - reason
      - version
    ApiResponseInventoryResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InventoryResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    InventoryResponse:
      type: object
      properties:
        inventoryId:
          type: string
          format: uuid
