          type: string
        evaluatedAt:
          type: string
          format: date-time
        stockReserved:
          type: boolean
      required:
      - cartId
      - cartVersion
      - currency
      - deliveryAddress
      - deliveryFee
      - deliverySlot
      - discount
      - evaluatedAt
      - grandTotal
      - items
      - pricingPolicyId
      - stockReserved
      - subtotal
      - tax
