components:
  schemas:
    VendorDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
      required:
      - version
    ApiResponseVendorOrderResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/VendorOrderResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    DeliveryQuote:
      type: object
      properties:
        deliverySlotId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        currency:
          type: string
        deliveryFee:
          type: number
        source:
          type: string
      required:
      - currency
      - deliveryFee
      - deliverySlotId
      - endsAt
      - source
      - startsAt
    Meta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - requestId
      - timestamp
    OrderLine:
      type: object
      properties:
        orderItemId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        productName:
          type: string
        vendorName:
          type: string
        vendorSku:
          type: string
        unitCode:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discountAmount:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
        productSnapshot:
          type: object
          additionalProperties: true
          description: "Immutable product, listing, vendor and authoritative price\
            \ snapshots"
      required:
      - discountAmount
      - lineTotal
      - listingId
      - orderItemId
      - productId
      - productName
      - productSnapshot
      - quantity
      - taxAmount
      - unitCode
      - unitPrice
      - vendorId
      - vendorName
      - vendorSku
    VendorOrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_AUTHORIZED
          - CONFIRMED
          - PAYMENT_FAILED
          - CANCEL_PENDING
          - CANCELLED
        vendorStatus:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
        currency:
          type: string
        deliverySlot:
          $ref: "#/components/schemas/DeliveryQuote"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        version:
          type: integer
          format: int64
      required:
      - currency
      - deliverySlot
      - items
      - orderId
      - orderNumber
      - status
      - vendorStatus
      - version
    CreateOrderRequest:
      type: object
      additionalProperties: false
      properties:
        cartId:
          type: string
          format: uuid
        deliveryAddressId:
          type: string
          format: uuid
        deliverySlotId:
          type: string
          format: uuid
        paymentMethodId:
          type: string
          format: uuid
      required:
      - cartId
      - deliveryAddressId
      - deliverySlotId
      - paymentMethodId
    Address:
      type: object
      properties:
        addressId:
          type: string
          format: uuid
        recipientName:
          type: string
        line1:
          type: string
        line2:
          type:
          - string
          - "null"
        city:
          type: string
        region:
          type:
          - string
          - "null"
        postalCode:
          type: string
        countryCode:
          type: string
        phone:
          type:
          - string
          - "null"
        version:
          type: integer
          format: int64
      required:
      - addressId
      - city
      - countryCode
      - line1
      - line2
      - phone
      - postalCode
      - recipientName
      - region
      - version
    ApiResponseOrderResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OrderResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAYMENT_AUTHORIZED
          - CONFIRMED
          - PAYMENT_FAILED
          - CANCEL_PENDING
          - CANCELLED
        currency:
          type: string
        subtotal:
          type: number
        discountAmount:
          type: number
        taxAmount:
          type: number
        deliveryFee:
          type: number
        grandTotal:
          type: number
