databaseChangeLog:
  - changeSet:
      id: supply-001-create-schema
      author: fresveg
      logicalFilePath: database/supply/changelog/001-create-supply-schema.yaml
      dbms: postgresql
      comment: Provision isolated schema, migration owner and runtime login without embedded credentials. No automated rollback after service initialization.
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM pg_roles WHERE rolname IN ('fresveg_supply', 'fresveg_supply_migrator')
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT count(*) FROM pg_namespace WHERE nspname = 'supply'
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE ROLE fresveg_supply_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
              CREATE ROLE fresveg_supply LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
              CREATE SCHEMA supply AUTHORIZATION fresveg_supply_migrator;
              REVOKE ALL ON SCHEMA supply FROM PUBLIC;
              GRANT USAGE ON SCHEMA supply TO fresveg_supply;
              ALTER ROLE fresveg_supply_migrator SET search_path = supply;
              ALTER ROLE fresveg_supply SET search_path = supply;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_supply_migrator IN SCHEMA supply REVOKE ALL ON TABLES FROM PUBLIC;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_supply_migrator IN SCHEMA supply REVOKE ALL ON SEQUENCES FROM PUBLIC;
              ALTER DEFAULT PRIVILEGES FOR ROLE fresveg_supply_migrator IN SCHEMA supply REVOKE EXECUTE ON FUNCTIONS FROM PUBLIC;
              DO $bootstrap$
              BEGIN
                EXECUTE format('GRANT CONNECT ON DATABASE %I TO fresveg_supply, fresveg_supply_migrator', current_database());
              END
              $bootstrap$;
