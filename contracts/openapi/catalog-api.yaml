components:
  schemas:
    ImageRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: "https://[^\\s]+"
        altText:
          type: string
          maxLength: 240
          minLength: 0
      required:
      - altText
      - url
    UpdateProductRequest:
      type: object
