openapi: 3.1.0
info:
  title: FresVeg Supply API
  description: Vendor listings and effective unit prices. Currency and quantity are
    explicit; tier prices apply to the whole quantity. Vendor selection requires live
    Account membership; writes require VENDOR_ADMIN. Offer browsing does not reserve
    stock. Inventory mutations and service reservations use a separate audited stock
    aggregate.
  version: 0.1.0
servers:
- url: /
paths:
  /api/v1/supply/vendor/locations/{locationId}:
    put:
      tags:
      - Supply offers
      summary: Vendor administrator updates an owned location using its version
      operationId: replaceVendorLocation
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        description: Optional safe request ID; invalid values are replaced
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLocationResponse"
        "400":
          description: "Invalid request, cursor or page size"
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "401":
          description: Missing or invalid bearer token
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "403":
          description: Required verified vendor role or configured service subject/scope
            is missing
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "500":
          description: Unexpected failure
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "503":
          description: Account or Catalog dependency is unavailable; validation fails
            closed
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "409":
          description: "Duplicate resource, stale version, conflicting request intent/state,\
            \ or insufficient eligible inventory"
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
        "404":
          description: Resource does not exist or is not visible to this caller
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SupplyProblem"
      security:
      - bearerAuth: []
