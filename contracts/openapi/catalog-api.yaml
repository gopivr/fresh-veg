              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
        "400":
          description: "Invalid request, cursor or page size"
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
