      - lineSubtotal
      - listingId
      - priceFetchedAt
      - priceId
      - quantity
      - tierId
      - unitPrice
    PreviewResponse:
      type: object
      properties:
        cartId:
          type: string
          format: uuid
        cartVersion:
          type: integer
          format: int64
        currency:
