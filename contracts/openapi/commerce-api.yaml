      - deliveryFee
      - deliverySlot
      - discountAmount
      - grandTotal
      - items
      - orderId
      - orderNumber
      - pricingPolicyId
      - reservationExpiresAt
      - shippingAddress
      - status
      - subtotal
      - taxAmount
      - version
