              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "500":
          description: Unexpected failure
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "503":
          description: Account authorization is unavailable; writes fail closed
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "409":
          description: "Duplicate code, invalid relation or stale aggregate version"
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "404":
          description: Resource does not exist or is not publicly visible
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
      security:
      - bearerAuth: []
    patch:
      tags:
      - Catalog
      summary: Change product status using the current version; other partial edits
        are not supported
      operationId: patchProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
