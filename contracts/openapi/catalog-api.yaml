openapi: 3.1.0
info:
  title: FresVeg Catalog API
  description: "Reusable master products, classification and metadata. Public reads\
    \ expose ACTIVE products. Mutations require stored PLATFORM_ADMIN authority from\
    \ Account."
  version: 0.1.0
servers:
- url: /
paths:
  /api/v1/catalog/products/{productId}:
    get:
      tags:
      - Catalog
      summary: Read active product metadata; non-active products are visible only
        to administrators
      operationId: getProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        description: Optional safe request ID; invalid values are replaced
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
        "400":
          description: "Invalid request, cursor or page size"
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "401":
          description: Missing or invalid bearer token
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "403":
          description: Stored platform administrator authority is required
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "500":
          description: Unexpected failure
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "503":
          description: Account authorization is unavailable; writes fail closed
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
        "404":
          description: Resource does not exist or is not publicly visible
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CatalogProblem"
    put:
      tags:
      - Catalog
      summary: Replace product metadata and children using the current aggregate version
      operationId: replaceProduct
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        description: Optional safe request ID; invalid values are replaced
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              description: Validated incoming ID or generated UUID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductResponse"
        "400":
          description: "Invalid request, cursor or page size"
          headers:
            X-Correlation-ID:
