openapi: 3.1.0
info:
  title: FresVeg Commerce API
  description: "Customer-owned carts. Prices are current Supply unit prices, never\
    \ persisted or client-authoritative. Checkout preview resolves current address,\
    \ prices, stock and explicit delivery/pricing policies without creating an order\
    \ or reservation. Orders persist authoritative snapshots, authorize payment through\
    \ a provider-neutral gateway, commit inventory and retain a transactional outbox."
  version: 0.1.0
servers:
- url: http://127.0.0.1:49403
  description: Generated server url
paths:
  /api/v1/vendor/orders/{orderId}/reject:
    post:
      tags:
      - vendor-order-controller
      summary: Vendor administrator rejects its items when the order is still awaiting
        payment
      operationId: rejectVendorOrder
      parameters:
      - name: vendorId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        description: Optional safe request ID
        schema:
          type: string
          maxLength: 128
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDecisionRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVendorOrderResponse"
        "400":
          description: Invalid request or changed cursor
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "401":
          description: Missing/invalid JWT
          headers:
            X-Correlation-ID:
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "403":
          description: Account identity denied
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "404":
          description: Owned cart/item/address not found
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "409":
          description: "Stale/empty cart, unavailable item/stock/address delivery\
            \ combination, or cart limit"
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "500":
          description: Unexpected failure
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
        "503":
          description: "Owner unavailable, malformed response, timeout or resilience\
            \ rejection; no stale price fallback"
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CommerceProblem"
      security:
      - bearerAuth: []
